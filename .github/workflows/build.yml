# On every push to main: the Firebase tests (auction rules, bidding functions, security rules) run in the
# Firebase emulators, and the app compiles for the simulator on a GitHub-hosted Mac without signing.
# TestFlight builds run on Codemagic (codemagic.yaml).
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  firebase:
    # The auction rules, the bidding functions and the security rules, tested in the Firebase emulators.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: |
          npm install -g firebase-tools
          npm ci --prefix firebase
          npm ci --prefix firebase/functions
          npm ci --prefix firebase/test
      - name: Auction rules
        run: npm test --prefix firebase/functions
      - name: Bidding and security rules
        run: npm test --prefix firebase/test

  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Eliskopes.xcodeproj -scheme Eliskopes \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*Eliskopes/|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
